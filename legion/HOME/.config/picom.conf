backend = "glx";
vsync = true;
xrender-sync-fence = true;

opacity-rule = [
    "100:class_g = 'Dunst'",
    "100:class_g = 'mpv'",
    "0:_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'",
    "100:class_g = 'URxvt' && focused",
    "75:class_g = 'URxvt' && !focused",
];

fading = true;
fade-delta = 7;
fade-in-step = 0.05;
fade-out-step = 0.05;

blur-background = true;
blur-background-fixed = true;
blur-kern = "7x7box";

blur-background-exclude = [
    "_GTK_FRAME_EXTENTS@",
    "class_g = 'slop'",
    "name *= 'i3lock'",
];

shadow = true;
shadow-radius = 10;
shadow-offset-x = -5;
shadow-offset-y = 0;
shadow-opacity = 0.8;
shadow-red = 0.11;
shadow-green = 0.12;
shadow-blue = 0.13;
shadow-ignore-shaped = true;

shadow-exclude = [
    "_GTK_FRAME_EXTENTS@",
    "_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'",
    "class_i = 'i3-frame'",
    "name = 'Firefox — Sharing Indicator'", # Firefox
];

use-ewmh-active-win = true;
dbe = false;
unredir-if-possible = true;

wintypes: {};
